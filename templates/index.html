<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turntable BPM Fader Calculator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="card">
        <h1>Turntable BPM Fader Calculator</h1>
        <p>
            Enter the BPM of the current song and the next track. 
            This calculates where to place your pitch fader on a <strong>±8%</strong> turntable.
        </p>

        <label for="currentBpm">Current song BPM</label>
        <input type="number" id="currentBpm" min="1" step="0.01" placeholder="e.g. 128">

        <label for="nextBpm">Next track BPM (original)</label>
        <input type="number" id="nextBpm" min="1" step="0.01" placeholder="e.g. 124">

        <button id="calculateBtn">Calculate fader position</button>

        <section id="result" aria-live="polite"></section>
    </main>

    <script>
        const MAX_RANGE = 8;

        function formatBpm(value) {
            return Number(value).toFixed(2);
        }

        function calculateFader() {
            const currentBpm = parseFloat(document.getElementById('currentBpm').value);
            const nextBpm = parseFloat(document.getElementById('nextBpm').value);
            const result = document.getElementById('result');

            if (!Number.isFinite(currentBpm) || !Number.isFinite(nextBpm) || currentBpm <= 0 || nextBpm <= 0) {
                result.className = 'result warning';
                result.textContent = 'Please enter valid BPM values greater than 0.';
                return;
            }

            const requiredPercent = ((currentBpm / nextBpm) - 1) * 100;
            const withinRange = requiredPercent >= -MAX_RANGE && requiredPercent <= MAX_RANGE;

            if (withinRange) {
                result.className = 'result ok';
                result.innerHTML = `Set your next track fader to <strong>${requiredPercent >= 0 ? '+' : ''}${requiredPercent.toFixed(2)}%</strong>.\n` +
                    `That brings ${formatBpm(nextBpm)} BPM to ${formatBpm(currentBpm)} BPM.`;
                return;
            }

            const clampedPercent = Math.max(-MAX_RANGE, Math.min(MAX_RANGE, requiredPercent));
            const closestBpm = nextBpm * (1 + clampedPercent / 100);

            result.className = 'result warning';
            result.innerHTML = `Required fader is <strong>${requiredPercent >= 0 ? '+' : ''}${requiredPercent.toFixed(2)}%</strong>, which is outside ±${MAX_RANGE}%.\n` +
                `Closest you can get is <strong>${clampedPercent >= 0 ? '+' : ''}${clampedPercent.toFixed(2)}%</strong> ` +
                `(${formatBpm(closestBpm)} BPM).`;
        }

        document.getElementById('calculateBtn').addEventListener('click', calculateFader);
    </script>
</body>
</html>
